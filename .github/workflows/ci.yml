name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      version:
        description: Initial Framework release version
        required: true
        type: choice
        options:
          - '0.3.2'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Set up Go for actionlint
      uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
      with:
        go-version: '1.25'
        cache: false

    - name: Lint GitHub Actions workflows
      run: go run github.com/rhysd/actionlint/cmd/actionlint@914e7df21a07ef503a81201c76d2b11c789d3fca .github/workflows/*.yml

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: '8.2'

    - name: Validate composer.json
      run: composer validate --strict

    - name: Install Dependencies
      run: composer install --prefer-dist --no-progress

    - name: Guard the RoadRunner-only runtime boundary
      run: |
        if rg -n 'NativeLoopAdapter|NdjsonRequestFactory|SwooleAdapter|fgets\(STDIN\)|fwrite\(STDOUT\)' tusk-runtime/src; then
          echo 'Removed runtime transport markers found in tusk-runtime/src.'
          exit 1
        fi
        if rg -n 'NativeLoopAdapter|NdjsonRequestFactory|SwooleAdapter|NDJSON' README.md tusk-runtime/README.md tusk-runtime/SPEC.md tusk-contracts; then
          echo 'Removed runtime markers found in active Framework documentation or contracts.'
          exit 1
        fi

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.2', '8.3', '8.4']

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

    - name: Setup PHP
      uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
      with:
        php-version: ${{ matrix.php-version }}
        coverage: none
        tools: composer, cs2pr

    - name: Get composer cache directory
      id: composer-cache
      run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

    - name: Cache dependencies
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ steps.composer-cache.outputs.dir }}
        key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
        restore-keys: ${{ runner.os }}-composer-

    - name: Install dependencies
      run: composer install --prefer-dist --no-progress

    - name: Run PHPUnit Tests
      run: vendor/bin/phpunit --testdox --colors=always

  release:
    needs: [validate, test]
    if: >-
      ${{ success() && github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    concurrency:
      group: framework-release-main
      cancel-in-progress: false
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
    - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      with:
        fetch-depth: 0
        persist-credentials: false

    - name: Gate bootstrap and automatic release
      id: release-gate
      shell: bash
      env:
        RELEASE_EVENT: ${{ github.event_name }}
        RELEASE_REF: ${{ github.ref }}
        RELEASE_VERSION: ${{ inputs.version }}
        RELEASE_COMMIT: ${{ github.sha }}
      run: |
        set -euo pipefail
        if [[ "$RELEASE_REF" != "refs/heads/main" ]]; then
          echo 'Releases require main.' >&2
          exit 1
        fi

        git fetch --tags origin
        remote_main_commit="$(git ls-remote origin refs/heads/main | cut -f1)"
        if [[ -z "$remote_main_commit" || "$remote_main_commit" != "$RELEASE_COMMIT" ]]; then
          echo 'The workflow commit is no longer the current main commit.' >&2
          exit 1
        fi

        if [[ "$RELEASE_EVENT" == "workflow_dispatch" ]]; then
          if [[ "$RELEASE_VERSION" != "0.3.2" ]]; then
            echo 'The initial release accepts only version 0.3.2.' >&2
            exit 1
          fi
          if git show-ref --verify --quiet refs/tags/v0.3.2; then
            tag_commit="$(git rev-list -n 1 refs/tags/v0.3.2)"
            if [[ "$tag_commit" != "$RELEASE_COMMIT" ]]; then
              echo 'v0.3.2 points to a different commit.' >&2
            else
              echo 'v0.3.2 already exists; refusing a second bootstrap.' >&2
            fi
            exit 1
          fi
          if [[ -n "$(git tag --list 'v[0-9]*')" ]]; then
            echo 'An existing release tag prevents initial bootstrap.' >&2
            exit 1
          fi
          echo 'mode=bootstrap' >> "$GITHUB_OUTPUT"
        elif [[ "$RELEASE_EVENT" == "push" ]]; then
          if ! git show-ref --verify --quiet refs/tags/v0.3.2; then
            echo 'v0.3.2 does not exist; skipping automatic release calculation.'
            echo 'mode=skip' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo 'mode=automatic' >> "$GITHUB_OUTPUT"
        else
          echo 'Unsupported release event.' >&2
          exit 1
        fi
